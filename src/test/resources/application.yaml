spring:
  datasource:
    # Tests run against SQLite too, never H2: the whole risk surface of this project
    # (DDL generation, IDENTITY ids, TEXT columns, lower()/LIKE behaviour) is engine
    # specific, so testing on another engine would validate nothing.
    #
    # A temp file is used instead of :memory: because every connection to :memory:
    # opens its own empty database, which makes tables disappear at random.
    #
    # foreign_keys is intentionally left off here: SQLite cannot DROP CONSTRAINT, so
    # ddl-auto=create-drop produces cleaner teardown without FK enforcement. FKs stay
    # enabled in dev/production, where they actually protect data.
    url: jdbc:sqlite:${java.io.tmpdir}/music-records-test.db?busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true

app:
  seeding:
    enabled: false

  # This file replaces the main application.yaml in tests, it does not merge with it, so every
  # JWT property has to be repeated here or the context fails to start.
  security:
    jwt:
      secret: dGVzdC1zaWduaW5nLWtleS1mb3ItbXVzaWMtcmVjb3Jkcy0yNTZiIQ==
      issuer: music-records
      access-token-expiration-ms: 900000
      refresh-token-expiration-ms: 604800000

logging:
  level:
    org.hibernate.stat: WARN
    org.hibernate.engine.internal: WARN

# Mirrors the production paths so tests exercise the same URLs as the running app.
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
